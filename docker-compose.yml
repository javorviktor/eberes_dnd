services:
  db:
    image: postgres:15
    container_name: dnd_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dnd
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dnd"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: dnd_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/dnd?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev_secret}
      PORT: 4000
      NODE_ENV: development
    ports:
      - "4000:4000"
    networks:
      - app-network
    command: ["pnpm", "start:migrate"]
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app
        - path: ./backend/package.json
          action: rebuild

  frontend:
    build: ./frontend
    container_name: dnd_frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://192.168.0.34:4000}
    ports:
      - "3000:3000"
    networks:
      - app-network
    develop:
      watch:
        - path: ./frontend
          action: sync
          target: /app
        - path: ./frontend/package.json
          action: rebuild

volumes:
  db_data:

networks:
  app-network:
    driver: bridge

